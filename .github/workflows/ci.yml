name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_PROJECT: ''
      GCLOUD_PROJECT: ''
      GOOGLE_GENAI_USE_VERTEXAI: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 -timeout=5m ./...
        env:
          # Exercise the existing local telemetry fallback, never ambient cloud credentials.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/no-google-credentials.json
